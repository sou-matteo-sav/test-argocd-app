apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: timai-app-pods
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: timai-app-test
  source:
    repoURL: "https://github.com/sou-matteo-sav/test-argocd-app.git" 
    targetRevision: "main"
    path: components/pods
  destination:
    server: https://api-hcpt4321765.hcp01-rn.hcps.cloudkube.tim.it:443
    namespace: timai-app-gitea
  syncPolicy:
    syncOptions:
      - ServerSideApply=true

