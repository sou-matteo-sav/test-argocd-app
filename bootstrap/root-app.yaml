# App-of-Apps root: vive su Argo CD in namespace "openshift-gitops"
# e crea localmente le Application figlie in apps/ che deployano remotamente su hcpt4321765.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: timai-app-root
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: "https://github.com/sou-matteo-sav/test-argocd-app.git"
    targetRevision: "main"
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    syncOptions:
      - ServerSideApply=true

